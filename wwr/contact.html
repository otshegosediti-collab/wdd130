<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rapid Splash Rafting</title>
    <meta name="description" content="Contact RSR Company">
    <meta name="author" content="Otshego Uhuru Sediti">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/raft-logo.jpg" alt=" People riding a raft on a river">
        <nav class="nav">
            <a href="index.html">Home</a>

            <a href="about.html">About us</a>

            <a href="trips.html">Trips</a>

            <a href="contact.html">Contact Us</a>
        </nav>
    </header>


    <main>
        <div class="company-info">
            <h1>Rapid Splash Rafting</h1>

            <p>67 Kopjeskraal Road<br>
                Parys, 9585<br>
                South Africa<br>
                +27 82 134 2534<br>
                info@rsr.com</p>
        </div>

        <div class="contact-middle">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d453455.41437657137!2d26.390155237459897!3d-27.38756735018215!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1eec7ebc1ca0d061%3A0x3cf9ffb6707333!2sVaal%20River!5e0!3m2!1sen!2sza!4v1791085126457!5m2!1sen!2sza"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form class="contact-form">
                <div class="form-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder">
                </div>
                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder">
                </div>
                <div class="form item">
                    <label>Message Purpose</label>
                    <div class="radio-group">
                        <label><input type="radio" name="purpose" value="general" checked> General
                            Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation">Reservation
                            Question</label>
                        <label><input type="radio" name="purpose" value="suggestion">Website
                            Suggestion</label>
                    </div>
                </div>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>
                </div>
                <div class="form-item">
                    <label><input type="checkbox" name="newsletter"> Please Subscribe me to the
                        monthly newsletter</label>
                </div>
                <button type="submit" class="sumbit-button">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here To Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee 1">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee 2">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee 3">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 🚣Rapid Splash Rafting🚣 Otshego Sediti</p>
        <nav class="socials">
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Facebook"></a>
            <p>Rapid Splash Rafting.facebook</p>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram"></a>
            <p>RSP.instagram</p>
            <a href="https://whatsapp.com">
                <img src="images/whatsapp.jpg" alt="Whatsapp"></a>
            <p>082 134 2534</p>
        </nav>
    </footer>

</body>

</html>
